# Cluster-scoped CRD that gates the agent's autonomy.
#
# observe-only: graph runs end-to-end but `execute` is a dry-run (logged only).
# active:       `execute` actually invokes kubectl/NetworkPolicy actions.
# frozen:       graph halts after `triage` and pages a human; useful during
#               incidents when even diagnosis traffic should be paused.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentmodes.security.poc
spec:
  group: security.poc
  scope: Cluster
  names:
    kind: AgentMode
    plural: agentmodes
    singular: agentmode
    shortNames:
      - am
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum:
                    - observe-only
                    - active
                    - frozen
                note:
                  type: string
                  description: Optional human-readable note (e.g., who flipped the mode and why).
            status:
              type: object
              properties:
                lastTransitionTime:
                  type: string
                  format: date-time
                lastObservedBy:
                  type: string
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
