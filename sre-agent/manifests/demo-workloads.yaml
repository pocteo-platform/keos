# Demo workloads the agent acts upon.
#
# nginx-demo:   a healthy Deployment with 3 replicas. Synthetic events target
#               one of these pods (e.g., scenario 1 "shell in container").
# busybox-bad:  a Deployment that intentionally crashloops, used by scenario 2.
#               The container exits non-zero on every start, so kubelet will
#               park it in CrashLoopBackOff almost immediately.
#
# Both expose a `shp.io/tier=demo` label that the OPA policy can key on if we
# ever want per-tier rules (not used in v1 of the matrix).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: workloads
  labels:
    app: nginx-demo
    shp.io/tier: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
        shp.io/tier: demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            # PoC demo: nginx-alpine needs CHOWN/SETUID/SETGID/NET_BIND_SERVICE at
            # startup. Hardened workloads on the Jetson target would use the
            # nginxinc/nginx-unprivileged image; that's out of scope here.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: workloads
spec:
  selector:
    app: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: workloads
  labels:
    app: broken-image
    shp.io/tier: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
        shp.io/tier: demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          # Deliberately bad image reference. K8sGPT's Pod analyzer will
          # flag this with ErrImagePull / ImagePullBackOff, demonstrating
          # the K8sGPT-vs-Falco contrast in scenario 6.
          image: ghcr.io/example/does-not-exist:v999
          imagePullPolicy: Always
          resources:
            requests: { cpu: 5m,  memory: 8Mi }
            limits:   { cpu: 50m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-bad
  namespace: workloads
  labels:
    app: busybox-bad
    shp.io/tier: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-bad
  template:
    metadata:
      labels:
        app: busybox-bad
        shp.io/tier: demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: busybox
          image: busybox:1.37
          # Deliberately fail on every start to exercise the CrashLoopBackOff
          # scenario. Exit code 1 is interpreted as a crash by kubelet.
          command: ["sh", "-c", "echo 'demo crashloop' >&2; exit 1"]
          resources:
            requests: { cpu: 5m,  memory: 8Mi }
            limits:   { cpu: 50m, memory: 32Mi }
