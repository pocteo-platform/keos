# Demo workloads the agent acts upon.
#
# nginx-demo:   a healthy Deployment with 3 replicas. Synthetic events target
#               one of these pods (e.g., scenario 1 "shell in container").
#               Chaos Mesh experiments target this Deployment to drive the
#               failure scenarios at demo time — the bootstrap should ship
#               a CLEAN cluster so reviewers see a green starting state.
#
# The intentionally-broken `broken-image` + `busybox-bad` Deployments that
# used to live here have been removed (Phase 14.13 demo-cleanup). They were
# only useful for the original `make demo` flow's static
# CrashLoopBackOff / ImagePullBackOff scenarios; with Chaos Mesh handling
# every failure injection through the Use Case wizard, the static broken
# pods only clutter the Reliability page and noise up the calibration store.
#
# To recreate a CrashLoopBackOff or ImagePullBackOff at demo time, use the
# Use Case wizard or run:
#   kubectl run broken-once --image=does-not-exist:v999 --restart=Never -n workloads
#
# Both expose a `shp.io/tier=demo` label that the OPA policy can key on if we
# ever want per-tier rules (not used in v1 of the matrix).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: workloads
  labels:
    app: nginx-demo
    shp.io/tier: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
        shp.io/tier: demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            # PoC demo: nginx-alpine needs CHOWN/SETUID/SETGID/NET_BIND_SERVICE at
            # startup. Hardened workloads on the Jetson target would use the
            # nginxinc/nginx-unprivileged image; that's out of scope here.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: workloads
spec:
  selector:
    app: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
