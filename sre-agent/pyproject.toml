[project]
name = "self-healing-agent"
version = "1.1.0"
description = "LangGraph state machine for the self-healing K8s edge security PoC."
requires-python = ">=3.11"
dependencies = [
    "langgraph==0.2.74",
    "pydantic>=2.11.7,<3",
    "nats-py==2.9.0",
    "qdrant-client==1.12.1",
    "httpx>=0.28.1,<1",
    "kubernetes==31.0.0",
    "python-dotenv>=1.1.0,<2",
    "fastmcp==3.3.1",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "python-multipart>=0.0.9,<1",
    # Per-IP rate limiting. Moving-window strategy backed by an in-memory
    # store (single-replica deployment is fine; switch to the redis
    # storage if/when we go multi-replica). We use `limits` directly
    # rather than slowapi because we want one global middleware-level
    # check, not per-route decorators.
    "limits>=3.13,<6",
    # Prometheus exposition for /metrics. Lightweight, in-process registry
    # with multiprocess support if we ever go multi-worker uvicorn.
    "prometheus-client>=0.21.1,<1",
    # Structured JSON logging (enabled via LOG_FORMAT=json env). Lets a
    # downstream log shipper (Loki, Datadog) parse every line without
    # custom grok patterns. Plain-text format stays available for `make demo`.
    "python-json-logger>=2.0.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "respx==0.21.1",
    "pytest-cov==5.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "respx==0.21.1",
    "pytest-cov==5.0.0",
    # Lint + typecheck. Pinned to versions known-good against our codebase
    # (Python 3.11 + 3.12, FastAPI 0.136, Pydantic 2.11). Bumping either
    # is fine — they're advisory, not gating, in CI today (10.7 tightens).
    "ruff>=0.8.0,<1",
    "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Lint (ruff). Fast + auto-fixable. Run via `make lint`.
#
# Rule set intentionally conservative for v1 — we enforce style + obvious
# bug patterns (E, F, B) and import hygiene (I) but stop short of the
# more opinionated checks until 10.7 lands the cleanup pass.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv", ".git", "__pycache__", "frontend",
    "agent/audit.log*", "agent/incidents", "agent/traces",
]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (real bugs).
# I = isort (import ordering).
# B = bugbear (sketchy patterns like mutable default args).
# UP = pyupgrade (modernize syntax for our py311 minimum).
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length — covered by `line-length`; ruff format handles edge cases.
    "B008",  # FastAPI uses `Depends(...)` as a default arg by design.
    "B904",  # `raise ... from` is good practice but our HTTPException paths are intentional.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # tests sometimes import inside fixtures
"agent/__init__.py" = ["F401"]  # re-exports

# ---------------------------------------------------------------------------
# Typecheck (mypy). Strictness ratchets up over time; v1 = "no obvious
# type errors in agent/ + mcp_server/". `ignore_missing_imports` keeps us
# from blocking on third-party stubs.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
# Start loose; tighten in 10.7.
check_untyped_defs = false
disallow_untyped_defs = false
follow_imports = "silent"
exclude = [
    "tests/",
    "frontend/",
    "scripts/",
    "agent/audit\\.log.*",
]

# ---------------------------------------------------------------------------
# Coverage (pytest-cov). Aim for ≥ 75 % on agent/ in 10.7; v1 just
# reports without gating.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["agent", "mcp_server"]
omit = [
    "agent/demo*.py",          # CLI entrypoints
    "agent/synthetic_events.py",  # CLI helper
    "agent/pull_models.py",    # one-shot installer
    "agent/seed_rag.py",       # one-shot installer
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
