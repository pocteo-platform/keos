# Minimal nginx config for the static Docusaurus site.
# Listens on :80 inside the container; compose maps that to :3000 on the host.

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip the things browsers ask for. Pre-built; nginx doesn't compress
    # per-request because Docusaurus's `npm run build` already emits
    # fingerprinted assets in `assets/`.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    # Long-cache the fingerprinted assets bundle. Each `npm run build`
    # produces fresh hashes so cache invalidation is automatic.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All other paths: serve the file if it exists, otherwise fall back
    # to index.html so client-side React Router URLs resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version + add minimal hardening headers. The docs site
    # has no auth + no user input; this is mostly defense-in-depth.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cheap healthcheck endpoint for compose / Kubernetes probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
