{{/*
  Caddy reverse proxy: / -> frontend, /api -> api, /ws -> api (WS upgrade).
  Caddyfile generated from a ConfigMap so the chart owns the config.
*/}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pocteo.fullname" . }}-caddy
  labels: {{- include "pocteo.labels" . | nindent 4 }}
data:
  Caddyfile: |
    :80 {
        encode gzip
        @api path /api/*
        handle @api {
            reverse_proxy api:8000
        }
        @ws path /ws/*
        handle @ws {
            reverse_proxy api:8000
        }
        handle {
            reverse_proxy frontend:80
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: pocteo
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  type: {{ .Values.caddy.service.type }}
  selector:
    app.kubernetes.io/name: pocteo
    app.kubernetes.io/component: caddy
  ports:
    - name: http
      port: {{ .Values.caddy.service.port }}
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocteo
        app.kubernetes.io/component: caddy
    spec:
      containers:
        - name: caddy
          image: {{ include "pocteo.image" (dict "global" .Values.global "repository" .Values.caddy.image.repository "tag" .Values.caddy.image.tag "firstParty" false) }}
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "pocteo.fullname" . }}-caddy
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocteo
  labels: {{- include "pocteo.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocteo
                port:
                  number: 80
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
