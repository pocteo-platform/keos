{{/*
  ServiceAccount + Role + ClusterRole bound to the same SA used by api +
  mcp-server. Allows: pod / deployment / event reads in workloads,
  pod-delete + deployment-scale + pods/eviction, AND node patch (cordon /
  drain). The OPA matrix is the second-layer guard on top of this.
*/}}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocteo-agent
  labels: {{- include "pocteo.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pocteo-agent
  labels: {{- include "pocteo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete, patch]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pocteo-agent
  labels: {{- include "pocteo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: pocteo-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pocteo-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pocteo.fullname" . }}-cluster
  labels: {{- include "pocteo.labels" . | nindent 4 }}
rules:
  - apiGroups: [security.poc]
    resources: [agentmodes]
    # patch + update are needed for POST /api/mode (the operator flips
    # the agent into observe-only / active / frozen via the SPA).
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [chaos-mesh.org]
    resources: [podchaos, networkchaos, stresschaos, iochaos, timechaos]
    verbs: [get, list, watch]
  # Cluster-context probe needs to enumerate the cluster's surface:
  # - CRDs (detect Argo CD / Flux / cert-manager / Chaos Mesh)
  # - Namespaces (which ones to probe)
  # - Deployments + StatefulSets at cluster scope (find Prometheus,
  #   kube-state-metrics, etc. without knowing their namespace upfront)
  # - Pods + Events at cluster scope (drift detection across namespaces)
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces, pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  # Apiserver-proxy access to Prometheus + kube-state-metrics — the
  # ML-baselines layer uses this rather than running Prometheus client
  # libs, so it works without any external network access.
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pocteo.fullname" . }}-cluster
  labels: {{- include "pocteo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: pocteo-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pocteo.fullname" . }}-cluster
