apiVersion: v1
kind: Service
metadata:
  name: opa
  labels: {{- include "pocteo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pocteo
    app.kubernetes.io/component: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocteo
        app.kubernetes.io/component: opa
    spec:
      containers:
        - name: opa
          image: {{ include "pocteo.image" (dict "global" .Values.global "repository" .Values.opa.image.repository "tag" .Values.opa.image.tag) }}
          args: ["run", "--server", "--addr=:8181", "--log-level=info", "/policies/agent.rego"]
          ports: [{ containerPort: 8181 }]
          resources: {{- toYaml .Values.opa.resources | nindent 12 }}
          volumeMounts:
            - name: policy
              # subPath bypasses the ConfigMap ..data/..timestamp symlink
              # chain that otherwise tricks OPA's directory scan into
              # seeing duplicate copies of agent.rego, which crashes
              # with "multiple default rules data.agent.authz.allow".
              mountPath: /policies/agent.rego
              subPath: agent.rego
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: {{ include "pocteo.fullname" . }}-opa-policy
