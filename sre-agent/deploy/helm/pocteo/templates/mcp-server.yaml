apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels: {{- include "pocteo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pocteo
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocteo
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: pocteo-agent
      {{- include "pocteo.podSecurityContext" . | nindent 6 }}
      containers:
        - name: mcp-server
          image: {{ include "pocteo.image" (dict "global" .Values.global "repository" .Values.mcpServer.image.repository "tag" .Values.mcpServer.image.tag "firstParty" true) }}
          {{- with .Values.mcpServer.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports: [{ containerPort: 8090 }]
          resources: {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          {{- include "pocteo.containerSecurityContext" . | nindent 10 }}
          # MCP server exposes a streamable HTTP endpoint at /mcp; a TCP
          # readiness probe is the cleanest health signal without baking
          # an MCP-aware client into the kubelet.
          readinessProbe:
            tcpSocket: { port: 8090 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            # kubectl runs as uid 1000 but the image leaves HOME=/root: it
            # dies on the unreadable /root/.kube/config instead of falling
            # back to the in-cluster service account. Point HOME somewhere
            # readable so the fallback engages.
            - name: HOME
              value: /tmp
            # The image bakes KUBECONFIG=/root/.kube/config for the
            # compose/laptop path; in-cluster that file is absent and
            # unreadable (uid 1000), and kubectl hard-fails on it instead
            # of using the ServiceAccount. Empty = unset for kubectl.
            - name: KUBECONFIG
              value: ""
            - name: OPA_URL
              value: "http://opa:8181"
            - name: AUDIT_LOG_PATH
              value: /audit/audit.log
            - name: FALLBACK_AGENT_MODE
              value: {{ .Values.mcpServer.fallbackMode | quote }}
          envFrom:
            - secretRef:
                name: {{ include "pocteo.authSecretName" . }}
          volumeMounts:
            - name: audit
              mountPath: /audit
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audit
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
