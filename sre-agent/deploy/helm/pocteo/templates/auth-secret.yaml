{{- include "pocteo.requireAuth" . -}}
{{- if not .Values.auth.existingSecret }}
{{/* Chart-managed auth Secret. Skipped entirely when auth.existingSecret is
     set — the GitOps/SOPS path (Phase 23) provides a pre-created Secret of
     the same shape (see pocteo.authSecretName), so Helm never holds the
     plaintext token. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pocteo.fullname" . }}-auth
  labels: {{- include "pocteo.labels" . | nindent 4 }}
type: Opaque
stringData:
  SHP_API_TOKEN: {{ .Values.auth.apiToken | quote }}
  AUDIT_HMAC_KEY: {{ .Values.auth.hmacKey | quote }}
  {{- if .Values.auth.falcoWebhookToken }}
  # Bearer token the Falco→agent webhook (/api/webhooks/falco) requires.
  # The api pod envFrom's this secret, so the handler picks it up with no
  # extra wiring. falcosidekick sends it via an Authorization header.
  FALCO_WEBHOOK_TOKEN: {{ .Values.auth.falcoWebhookToken | quote }}
  {{- end }}
{{- end }}
