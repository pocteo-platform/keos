apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "pocteo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pocteo
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocteo
        app.kubernetes.io/component: frontend
    spec:
      {{- include "pocteo.podSecurityContext" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "pocteo.image" (dict "global" .Values.global "repository" .Values.frontend.image.repository "tag" .Values.frontend.image.tag "firstParty" true) }}
          {{- with .Values.frontend.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports: [{ containerPort: 8080 }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          # nginx-unprivileged runs as uid 101 and listens on 8080 by
          # default — no NET_BIND_SERVICE needed (unprivileged port).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - { name: cache,     mountPath: /var/cache/nginx }
            - { name: run,       mountPath: /var/run }
            - { name: tmp,       mountPath: /tmp }
      volumes:
        - name: cache
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
