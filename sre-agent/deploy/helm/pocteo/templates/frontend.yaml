apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "pocteo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pocteo
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocteo
        app.kubernetes.io/component: frontend
    spec:
      {{- include "pocteo.podSecurityContext" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "pocteo.image" (dict "global" .Values.global "repository" .Values.frontend.image.repository "tag" .Values.frontend.image.tag) }}
          ports: [{ containerPort: 80 }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          # nginx-alpine runs as uid 101 by default; override the
          # common security context to match its non-root uid + provide
          # the writable paths nginx needs (cache, pid, run).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              # nginx in nginx:alpine binds to port 80 — needs NET_BIND_SERVICE.
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - { name: cache,     mountPath: /var/cache/nginx }
            - { name: run,       mountPath: /var/run }
            - { name: tmp,       mountPath: /tmp }
      volumes:
        - name: cache
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
