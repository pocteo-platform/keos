{{/*
  The FastAPI + agent runtime. Mounts the shared auth secret + uses the
  cluster's in-cluster ServiceAccount token to talk to the Kubernetes API.
  The agent ServiceAccount + RBAC come from `agent-rbac.yaml`.
*/}}

apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "pocteo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pocteo
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocteo
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: pocteo-agent
      {{- include "pocteo.podSecurityContext" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "pocteo.image" (dict "global" .Values.global "repository" .Values.api.image.repository "tag" .Values.api.image.tag) }}
          ports: [{ containerPort: 8000 }]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "pocteo.containerSecurityContext" . | nindent 10 }}
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds:      {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold:    {{ .Values.api.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds:      {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold:    {{ .Values.api.probes.readiness.failureThreshold }}
          # Startup probe lets the slow first-boot (mode_store initial GET +
          # NATS connection + Ollama warmup if pre-warmed) take its time
          # without burning the liveness counter.
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds:    {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: OPA_URL
              value: "http://opa:8181"
            - name: MCP_URL
              value: "http://mcp-server:8090/mcp"
            - name: K8SGPT_URL
              value: ""
            - name: OLLAMA_CHAT_MODEL
              value: {{ .Values.ollama.chatModel | quote }}
            - name: OLLAMA_EMBED_MODEL
              value: {{ .Values.ollama.embedModel | quote }}
            - name: AGENT_CONFIDENCE_THRESHOLD
              value: {{ .Values.agent.confidenceThreshold | quote }}
            - name: FALLBACK_AGENT_MODE
              value: {{ .Values.agent.defaultMode | quote }}
            - name: AUDIT_LOG_PATH
              value: /audit/audit.log
            - name: SHP_USECASES_PATH
              value: /data/shp-usecases.json
            - name: POCTEO_PRODUCT_NAME
              value: "Keos"
            {{- if .Values.notifications.slackWebhookUrl }}
            - name: SLACK_WEBHOOK_URL
              value: {{ .Values.notifications.slackWebhookUrl | quote }}
            {{- end }}
            {{- if .Values.notifications.pageHumanWebhookUrl }}
            - name: PAGE_HUMAN_WEBHOOK_URL
              value: {{ .Values.notifications.pageHumanWebhookUrl | quote }}
            {{- end }}
            {{- if .Values.inbound.alertmanagerWebhookToken }}
            - name: ALERTMANAGER_WEBHOOK_TOKEN
              value: {{ .Values.inbound.alertmanagerWebhookToken | quote }}
            {{- end }}
            {{- with .Values.agent.watchNamespaces }}
            - name: WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.api.allowedOrigins }}
            - name: KEOS_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: KEOS_RATE_LIMIT_GLOBAL
              value: {{ .Values.api.rateLimit | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: AUDIT_LOG_RETENTION_DAYS
              value: {{ .Values.retention.auditDays | quote }}
            - name: INCIDENT_RETENTION_DAYS
              value: {{ .Values.retention.incidentDays | quote }}
            - name: TRACE_RETENTION_DAYS
              value: {{ .Values.retention.traceDays | quote }}
            - name: RETENTION_SWEEP_INTERVAL_S
              value: {{ .Values.retention.sweepIntervalS | quote }}
            # ---- Phase 12 — calibration ---------------------------
            {{- if .Values.calibration.enabled }}
            - name: KEOS_CALIBRATION_ENABLED
              value: "1"
            - name: CALIBRATION_DB_PATH
              value: {{ .Values.calibration.dbPath | quote }}
            - name: CALIBRATION_MIN_SAMPLES
              value: {{ .Values.calibration.minSamples | quote }}
            {{- else }}
            - name: KEOS_CALIBRATION_ENABLED
              value: "0"
            {{- end }}
            # ---- Phase 13 — ML baselines --------------------------
            - name: PROMETHEUS_URL
              value: {{ .Values.baselines.prometheusUrl | quote }}
            - name: BASELINE_SCRAPE_INTERVAL_S
              value: {{ .Values.baselines.scrapeIntervalS | quote }}
            - name: BASELINE_FIT_INTERVAL_S
              value: {{ .Values.baselines.fitIntervalS | quote }}
            - name: BASELINE_QUERY_PROFILE
              value: {{ .Values.baselines.queryProfile | quote }}
            - name: BASELINE_MIN_SAMPLES
              value: {{ .Values.baselines.minSamples | quote }}
            - name: BASELINES_DB_PATH
              value: {{ .Values.baselines.dbPath | quote }}
            # ---- Phase 14 — predictive forecasting ----------------
            {{- if .Values.forecasting.enabled }}
            - name: FORECAST_ENABLED
              value: "1"
            - name: FORECAST_TICK_INTERVAL_S
              value: {{ .Values.forecasting.tickIntervalS | quote }}
            - name: FORECAST_FIT_WINDOW
              value: {{ .Values.forecasting.fitWindow | quote }}
            - name: FORECAST_DEDUP_WINDOW_S
              value: {{ .Values.forecasting.dedupWindowS | quote }}
            - name: FORECAST_R2_MIN
              value: {{ .Values.forecasting.r2Min | quote }}
            {{- else }}
            - name: FORECAST_ENABLED
              value: "0"
            {{- end }}
            # ---- Phase 15 — GitOps drift detection ----------------
            - name: DRIFT_SOURCE_TYPE
              value: {{ .Values.drift.sourceType | quote }}
            - name: DRIFT_SOURCE_PATH
              value: {{ .Values.drift.sourcePath | quote }}
            - name: DRIFT_TICK_INTERVAL_S
              value: {{ .Values.drift.tickIntervalS | quote }}
            - name: DRIFT_DEDUP_WINDOW_S
              value: {{ .Values.drift.dedupWindowS | quote }}
            # -------------------------------------------------------
            # Token file lets the SHP_API_TOKEN live in a K8s Secret
            # projected-volume mount, so `kubectl edit secret` rotates it
            # without re-rolling the Deployment.
            - name: SHP_API_TOKEN_FILE
              value: /secrets/api-token
          envFrom:
            - secretRef:
                name: {{ include "pocteo.fullname" . }}-auth
          volumeMounts:
            - name: audit
              mountPath: /audit
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem requires a writable /tmp for libraries
            # that buffer (httpx, uvicorn, langgraph checkpoint serdes).
            - name: tmp
              mountPath: /tmp
            # Bearer token from a projected Secret. `subPath: api-token`
            # so the consumer sees a flat file at /secrets/api-token.
            - name: api-token
              mountPath: /secrets
              readOnly: true
            {{- if and (eq .Values.drift.sourceType "manifests") .Values.drift.sourceConfigMap }}
            # Phase 15 — GitOps source-of-truth manifests. The
            # ConfigMap holds one key per YAML file; each key is
            # exposed at /manifests/<key>.
            - name: drift-manifests
              mountPath: {{ .Values.drift.sourcePath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: audit
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: api-token
          secret:
            secretName: {{ include "pocteo.fullname" . }}-auth
            items:
              - key: SHP_API_TOKEN
                path: api-token
            defaultMode: 0400
        {{- if and (eq .Values.drift.sourceType "manifests") .Values.drift.sourceConfigMap }}
        - name: drift-manifests
          configMap:
            name: {{ .Values.drift.sourceConfigMap }}
        {{- end }}
