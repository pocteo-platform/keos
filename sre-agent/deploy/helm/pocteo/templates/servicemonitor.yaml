{{/*
  ServiceMonitor — Prometheus Operator discovers the agent's /metrics
  endpoint via this CR. Gated on `monitoring.enabled` so installs without
  the operator don't try to apply an unrecognised kind.

  The `serviceMonitorSelector` on the Prometheus instance MUST match the
  labels we ship here. Most operator installs use either
  `prometheus.io/operator: <name>` or `release: kube-prometheus-stack` —
  set `monitoring.labels` to whatever your cluster expects.
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
      # /metrics is exempt from auth + rate-limiting — see api.py
      # _RATE_LIMIT_EXEMPT_PATHS. Plain HTTP works.
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
