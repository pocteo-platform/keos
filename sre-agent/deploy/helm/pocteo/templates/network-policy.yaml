{{/*
  NetworkPolicy: per-component egress + ingress restrictions.

  Gated on `.Values.networkPolicy.enabled` (default true). Disable on
  clusters whose CNI does NOT enforce policies — vanilla k3s/flannel
  silently accepts but doesn't apply them, leaving the operator with
  a false sense of security.

  Topology:
    Caddy        --[80, ws]--> Frontend
                 --[8000]----> API
    API          --[8000]----> MCP server, OPA, Qdrant, NATS, Ollama, K8sGPT, K8s apiserver, kube-dns
    MCP server   --[8181]----> OPA
                 --[443]-----> K8s apiserver
    Frontend     <-- ingress from Caddy only; no egress required

  Everything else is denied.
*/}}
{{- if .Values.networkPolicy.enabled }}

{{/* All policies key off the same chart labels so a NetworkPolicy stays
     correct even if pod names change. NOTE: pod templates only set
     `app.kubernetes.io/name: pocteo` + `app.kubernetes.io/component: <X>`
     on the spec.template.metadata.labels — they do NOT carry the
     `part-of: pocteo` label from `pocteo.labels` (that one only lands
     on top-level resource metadata). Filtering ingress on `name`
     matches what the pods actually have. */}}
{{- $partOf := "pocteo" -}}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    # From Caddy (HTTP API + WebSocket) and from MCP server (none today,
    # but reserved if the agent later inverts the call direction).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $partOf }}
              app.kubernetes.io/component: caddy
      ports:
        - { port: 8000, protocol: TCP }
  egress:
    # Stateful stores + policy gate inside the release namespace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $partOf }}
      ports:
        - { port: 11434, protocol: TCP }   # Ollama
        - { port: 6333,  protocol: TCP }   # Qdrant
        - { port: 4222,  protocol: TCP }   # NATS
        - { port: 8181,  protocol: TCP }   # OPA
        - { port: 8090,  protocol: TCP }   # MCP server
        - { port: 8089,  protocol: TCP }   # K8sGPT (optional)
    # Cluster DNS (kube-dns / coredns lives in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- include "pocteo.apiServerEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: mcp-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $partOf }}
              app.kubernetes.io/component: api
      ports:
        - { port: 8090, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $partOf }}
              app.kubernetes.io/component: opa
      ports:
        - { port: 8181, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # K8s apiserver — required because the MCP tools call kubectl, which
    # talks to the apiserver under the hood.
    {{- include "pocteo.apiServerEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocteo
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $partOf }}
              app.kubernetes.io/component: caddy
      ports:
        # nginx-unprivileged listens on 8080 (no NET_BIND_SERVICE = no
        # privileged port). The Service.spec.ports[].targetPort is 8080
        # too, so the packet hits the pod on 8080 — NetworkPolicy filters
        # the destination port, not the Service.port (80).
        - { port: 8080, protocol: TCP }
  egress: []  # The SPA is static; nginx doesn't need outbound traffic.
---
{{/* OPA / Qdrant / NATS / Ollama / K8sGPT only need to accept calls
     from inside the release. They live inside `part-of: pocteo` so a
     single shared policy is enough. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stateful-stores
  labels:
    {{- include "pocteo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [{{ $partOf }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [ollama, qdrant, nats, opa, k8sgpt]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $partOf }}
  egress:
    # K8sGPT needs to talk to the kube-apiserver. The others only need
    # cluster DNS; both are cheap to allow uniformly.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- include "pocteo.apiServerEgress" . | nindent 4 }}
{{- end }}
