apiVersion: v2
name: pocteo
description: |
  Keos — The Autonomous AI SRE Platform for Your Cloud-Native
  Infrastructure. Installs the full Keos stack (Ollama, Qdrant, NATS,
  OPA, MCP server, API, frontend, Caddy ingress) plus the agent runtime
  itself, all in one namespace.

type: application
version: 1.1.0
appVersion: "1.1.0"

keywords:
  - sre
  - kubernetes
  - ai-agent
  - self-healing
  - autonomous
maintainers:
  - name: Keos platform
    url: https://github.com/your-org/pocteo

# Chaos Mesh is optional but recommended for the SRE demo. Toggle via
# `--set chaos-mesh.enabled=false`.
#
# Falco + Tetragon are the runtime-security telemetry sources for the
# Keos security domain (Phase 21). Both default OFF — the security domain
# runs synthetic events without them. Turn on for live eBPF detection via
# `install-edge.sh --security`, `keosctl deps install falco|tetragon`, or
# `--set falco.enabled=true --set tetragon.enabled=true`.
#
# Falco ships twice, never both enabled:
#   falco         9.2.0  (Falco 0.45) — modern_ebpf on BTF kernels. 0.40's
#                        modern probe fails the BPF verifier on 6.18 kernels.
#   falco-legacy  4.21.3 (Falco 0.40) — the legacy eBPF probe for BTF-less
#                        kernels (Jetson L4T). Falco 0.41+ dropped that probe
#                        (only kmod + modern_ebpf remain), so this tier stays
#                        on 0.40 with a prebuilt probe (keosctl falco-probe).
dependencies:
  - name: chaos-mesh
    version: "2.7.2"
    repository: https://charts.chaos-mesh.org
    condition: chaos-mesh.enabled
    alias: chaos-mesh
  - name: falco
    version: "9.2.0"
    repository: https://falcosecurity.github.io/charts
    condition: falco.enabled
    alias: falco
  - name: falco
    version: "4.21.3"
    repository: https://falcosecurity.github.io/charts
    condition: falco-legacy.enabled
    alias: falco-legacy
  - name: tetragon
    version: "1.4.1"
    repository: https://helm.cilium.io
    condition: tetragon.enabled
    alias: tetragon
