worker_processes auto;
# nginx-unprivileged runs as uid 101: /run is not writable in docker compose
# (Helm mounts /tmp as an emptyDir), so the pid file lives in /tmp.
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: any 404 inside / goes back to index.html so the
        # React Router can resolve client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
            # Don't cache index.html (so bundle-hashed assets actually
            # invalidate on deploy).
            add_header Cache-Control "no-cache";
        }

        # Hashed asset bundles can be cached aggressively.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
