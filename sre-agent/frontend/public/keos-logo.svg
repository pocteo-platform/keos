<?xml version="1.0" encoding="UTF-8"?>
<!--
  Keos hexagonal mark for the SPA. Brand colors: #15117A → #080646.
  Replace with the real PNG export from the brand pack by saving as
  `keos-logo.png` in this directory and updating the Sidebar import.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Keos">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080646"/>
      <stop offset="100%" stop-color="#15117A"/>
    </linearGradient>
  </defs>
  <!-- Outer hexagon -->
  <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" fill="url(#kg)"/>
  <!-- Inner negative hexagon -->
  <path d="M32 12 L48 22 L48 42 L32 52 L16 42 L16 22 Z" fill="#FFFFFF"/>
  <!-- Lion-head silhouette: ears + cleft + jawline -->
  <path d="M22 26 L26 22 L30 26 L32 22 L34 26 L38 22 L42 26 L42 38 L36 44 L32 42 L28 44 L22 38 Z"
        fill="url(#kg)"/>
  <!-- Eyes -->
  <rect x="27" y="30" width="2.2" height="3" fill="#FFFFFF"/>
  <rect x="34.8" y="30" width="2.2" height="3" fill="#FFFFFF"/>
  <!-- Nose / muzzle hint -->
  <path d="M31 36 L33 36 L32 39 Z" fill="#FFFFFF"/>
</svg>
