<?xml version="1.0" encoding="UTF-8"?>
<!--
  Keos brand mark — hexagonal lion shield. Used in the SPA sidebar + topbar
  + login screen. Two-tone blue gradient (#3B3DFF → #1614B2 → #08056D).
  For a pixel-perfect raster, save the brand PNG as `keos-logo.png` next to
  this file and update Sidebar.tsx / TopBar.tsx / login.tsx imports.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="64" height="64"
     role="img" aria-label="Keos">
  <defs>
    <linearGradient id="keosGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3B3DFF"/>
      <stop offset="55%"  stop-color="#1614B2"/>
      <stop offset="100%" stop-color="#08056D"/>
    </linearGradient>
  </defs>
  <path d="M100 8 L176 51 L176 149 L100 192 L24 149 L24 51 Z"
        fill="none" stroke="url(#keosGrad)" stroke-width="14" stroke-linejoin="miter"/>
  <path d="M100 38 L156 70 L156 138 L130 168 L70 168 L44 138 L44 70 Z"
        fill="url(#keosGrad)"/>
  <path d="M100 56 L138 78 L138 124 L116 148 L84 148 L62 124 L62 78 Z"
        fill="#FFFFFF"/>
  <path d="M76 78 L70 64 L86 70 Z"  fill="url(#keosGrad)"/>
  <path d="M124 78 L130 64 L114 70 Z" fill="url(#keosGrad)"/>
  <path d="M88 78 L100 96 L112 78 L112 108 L100 122 L88 108 Z"
        fill="url(#keosGrad)"/>
  <rect x="74"  y="100" width="10" height="6" rx="1" fill="url(#keosGrad)"/>
  <rect x="116" y="100" width="10" height="6" rx="1" fill="url(#keosGrad)"/>
  <path d="M94 130 L106 130 L100 142 Z" fill="url(#keosGrad)"/>
</svg>
